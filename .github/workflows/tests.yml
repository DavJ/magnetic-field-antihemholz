name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest
      - run: antihemholtz-stl smoke.stl
      - run: antihemholtz-potential
      - run: antihemholtz-cavity --radial-cells 12 --axial-cells 24
      - run: antihemholtz-transfer --scenario balanced-pair

      - run: python scripts/finite_core_audit.py --check
