[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "magnetic-field-antihemholz"
version = "0.1.0"
description = "Loop fields, toroidal vector potentials and axisymmetric Maxwell cavity modes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "numpy-stl>=3.1",
]

[project.optional-dependencies]
test = ["pytest>=7"]
report = ["matplotlib>=3.7"]

[project.scripts]
antihemholtz-stl = "main:main"
antihemholtz-potential = "toroidal_potential:main"
antihemholtz-cavity = "cavity_modes:main"

[tool.setuptools]
py-modules = ["field_calculator", "main", "toroidal_potential", "cavity_profile", "cavity_modes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
